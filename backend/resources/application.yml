spring:
  application:
    name: AgentCloudDisk
  datasource:
    url: ${DB_URL:jdbc:postgresql://127.0.0.1:5432/agent_cloud_disk}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:061208}
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 64MB
      max-request-size: 64MB

mybatis:
  configuration:
    map-underscore-to-camel-case: true
    jdbc-type-for-null: 'NULL'

server:
  port: 8080

app:
  jwt:
    secret: ${JWT_SECRET:agent-cloud-disk-demo-secret-key-change-me-0123456789}
    expire-hours: 72
  storage:
    root: ${APP_STORAGE_ROOT:./data/storage}
    temp-root: ${APP_TEMP_ROOT:./data/temp}
  upload:
    chunk-size: 5242880
  # 多平台 AI：模型与 Key 由管理后台维护（Key 用 AES-GCM 加密入库）
  ai:
    enabled: ${AI_ENABLED:true}
    cooldown-seconds: ${AI_COOLDOWN_SECONDS:60}
  # 首次启动时用于播种默认模型的引导值，之后以管理后台配置为准
  deepseek:
    enabled: ${DEEPSEEK_ENABLED:true}
    api-key: ${DEEPSEEK_API_KEY:}
    base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com}
    model: ${DEEPSEEK_MODEL:deepseek-chat}
    timeout-seconds: 60
  # API Key 加密主密钥：优先环境变量，其次本地密钥文件（不入库、不提交）
  crypto:
    master-key: ${APP_MASTER_KEY:}
    master-key-file: ${APP_MASTER_KEY_FILE:./data/master.key}
  ocr:
    enabled: ${APP_OCR_ENABLED:true}
    timeout-seconds: 90

logging:
  level:
    com.pgigi.agentclouddisk: info
